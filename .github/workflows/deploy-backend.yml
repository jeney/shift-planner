name: Deploy backend to Cloud Run

# Inactive until the repository variables from deploy/gcp-setup.sh are set.
on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/deploy-backend.yml]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless authentication to Google Cloud

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SERVICE: shift-planner-api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/shift-planner/backend:${{ github.sha }}

jobs:
  deploy:
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build --target prod -t "$IMAGE" backend
          docker push "$IMAGE"
      - name: Deploy
        # 4 vCPU / 2 GiB gives good plans within the 20 s solver limit (see README → Hosting).
        # One instance at most keeps costs bounded; it scales to zero when idle.
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --cpu 4 --memory 2Gi \
            --min-instances 0 --max-instances 1 --concurrency 4 \
            --timeout 120 --cpu-boost \
            --allow-unauthenticated \
            --set-env-vars 'SP_CORS_ORIGINS=["https://${{ github.repository_owner }}.github.io"]'
          URL="$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --format='value(status.url)')"
          curl -fsS "$URL/api/health"
          echo "### Backend deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
